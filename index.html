<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanbam</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" type="lightbulb" href="lightbulb-solid.svg">
</head>
<body>

  <!-- Botão para abrir a barra lateral -->
  <button class="toggle-sidebar">☰</button>

  <!-- Barra lateral -->
  <aside class="sidebar">
    <div class="profile-section">
      <div class="profile-picture">
        <img src="man-avatar.png" alt="Foto de perfil">
      </div>
      <h2>Jack</h2>
      <p>Desenvolvedor fullstack</p>
    </div>

    <ul class="menu">
      <li><button class="menu-item" id="btn-projetos">Projetos</button></li>
      <li><a href="#">Configurações</a></li>
      <li><a href="#">Ajuda</a></li>
    </ul>

  <div id="projetos-section" class="hidden">
    <h3>Gerenciar Projetos</h3>
    <input id="project-input" type="text" placeholder="Digite o nome do projeto">
    <button id="add-project">Salvar Projeto</button>

    <h4>Projetos Salvos:</h4>
    <ul id="project-list">
      <!-- Projetos serão adicionados dinamicamente aqui -->
    </ul>
  </div>
</aside>

  <!-- Conteúdo principal -->
  <main>
    <section id="projetos" class="hidden">
      <h1>Projetos</h1>
      <p>Aqui você pode explorar seus projetos em andamento.</p>
    </section>
  </main>
    
    <div class="kanban-board">
        <!-- Coluna "A Fazer" -->
        <div class="kanban-column">
            <h2>A Fazer</h2>
            <div class="kanban-cards" id="to-do" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <button class="add-card" onclick="addCard('to-do')">Adicionar Tarefa</button>
            <i class="fa-solid fa-solid"> </i>
        </div>

        <!-- Coluna "Em Progresso" -->
        <div class="kanban-column">
            <h2>Em Progresso</h2>
            <div class="kanban-cards" id="in-progress" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <button onclick="addCard('in-progress')">Adicionar Tarefa</button>
        </div>

        <!-- Coluna "Concluído" -->
        <div class="kanban-column">
            <h2>Concluído</h2>
            <div class="kanban-cards" id="done" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <button onclick="addCard('done')">Adicionar Tarefa</button>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
